[package]
name = "ud-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ud-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
tokio = { workspace = true }

[features]
# Type-checks the macOS backend on any host. `cargo check` never links, so the
# CoreGraphics symbols stay unresolved, but every type and name is verified.
# Used by CI and by developers working on a Windows or Linux machine.
parse-check-macos = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
