name: Release

# Push a tag such as v0.1.0 to build installers for every platform and attach
# them to a draft GitHub release. The workflow can also be started by hand from
# the Actions tab, which is useful for producing a build without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - label: macOS universal
            os: macos-latest
            # One disk image that runs natively on both Apple silicon and Intel.
            # GitHub no longer offers Intel macOS runners, so the x86_64 slice is
            # cross compiled on an arm64 host, which Apple's toolchain supports.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # The workspace keeps its build output at the repository root.
          workspaces: ". -> target"

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt

      # Actions logs need a signed-in account to read. Keeping the output as an
      # artefact means a failure can be inspected by anyone, which matters when
      # the person who can fix it is not the person who can log in.
      - name: Keep the test output when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log-${{ matrix.target }}
          path: test-output.txt
          if-no-files-found: ignore

      # To ship signed and notarised macOS builds, add these repository secrets
      # and uncomment the env block. Without them the bundles are unsigned and
      # Gatekeeper will warn on first launch.
      #
      # env:
      #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "UnionDesk ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Installers for Windows and macOS are attached below.

            macOS builds are unsigned: right click the application and choose
            Open the first time.
          releaseDraft: true
          prerelease: false

      - name: Checksums
        shell: bash
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          if [ -d "$bundle" ]; then
            find "$bundle" -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
              -exec shasum -a 256 {} \; > "target/checksums-${{ matrix.target }}.txt"
            cat "target/checksums-${{ matrix.target }}.txt"
          fi

      # A second copy of the artefacts, so a build stays downloadable even while
      # the release itself is still a draft.
      - uses: actions/upload-artifact@v4
        with:
          name: uniondesk-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/checksums-${{ matrix.target }}.txt
          if-no-files-found: warn
