[workspace]
resolver = "2"
members = [
    "crates/ud-core",
    "crates/ud-net",
    "crates/ud-input",
    "crates/ud-clipboard",
    "crates/ud-engine",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["UnionDesk Contributors"]

[workspace.dependencies]
ud-core = { path = "crates/ud-core" }
ud-net = { path = "crates/ud-net" }
ud-input = { path = "crates/ud-input" }
ud-clipboard = { path = "crates/ud-clipboard" }
ud-engine = { path = "crates/ud-engine" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }
snow = "0.9"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.13"
arboard = "3"
png = "0.17"
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
